[project]
name = "albatroz-shorts"
version = "0.1.0"
description = "Long-form class to vertical Shorts, native on Apple Silicon and Windows"
requires-python = ">=3.12"
dependencies = [
  "pyobjc-framework-Vision>=10.3; sys_platform == 'darwin'",
  # off the Mac: YuNet + YOLOX-S detection (detect_onnx.py) and the Windows Credential Manager
  "opencv-python-headless>=4.10; sys_platform != 'darwin'",
  "onnxruntime>=1.20; sys_platform != 'darwin'",
  "numpy>=2.0; sys_platform != 'darwin'",
  "keyring>=25; sys_platform != 'darwin'",
  "jsonschema>=4.23",
  "anthropic>=0.60",
  "openai>=1.99",
]

[project.scripts]
shorts = "shorts.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/shorts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
markers = ["live: calls a real LLM backend; run with -m live"]
addopts = "-m 'not live'"
